name: run_free
description: "Free and open-source running, cycling and activity tracking. Your data stays on your device unless you choose to sync it, encrypted."
publish_to: 'none'

# version: <semver>+<build number>
# Android: versionName+versionCode. iOS: CFBundleShortVersionString+CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- Background geolocation -------------------------------------------------
  # Apache-2.0. Motion-detection driven tracking with its own SQLite queue.
  tracelet: ^3.8.3

  # --- State management -------------------------------------------------------
  # MIT. Providers are written by hand rather than generated: one less
  # build_runner step for contributors to discover, and Riverpod 3's Notifier
  # API is readable without codegen.
  flutter_riverpod: ^3.4.2

  # --- Persistence ------------------------------------------------------------
  # MIT. Typed SQL + migrations. Encryption later is a build config change
  # (SQLite3MultipleCiphers), not a rewrite.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # --- Navigation -------------------------------------------------------------
  go_router: ^17.0.0

  # --- Maps -------------------------------------------------------------------
  # BSD-3. Pure-Dart rendering, no platform views, any tile source.
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  # MIT tile cache. Deliberately not flutter_map_tile_caching, which is GPL-3.0
  # and would make the combined binary GPL — incompatible with App Store terms.
  flutter_map_cache: ^2.1.0
  dio: ^5.7.0
  dio_cache_interceptor: ^4.0.3
  # Persistent (on-disk) tile cache. Without a file-backed store the cache is
  # memory-only and every app launch re-downloads the same tiles.
  http_cache_file_store: ^2.0.2

  # --- Platform / utilities ---------------------------------------------------
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  # Activity IDs are UUIDs, not autoincrement ints, so records stay unique
  # across devices when sync arrives.
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  # GPX read/write.
  xml: ^6.5.0
  share_plus: ">=12.0.0 <13.1.0"
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.34.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
